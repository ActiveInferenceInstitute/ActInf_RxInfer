name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The matrix runs one arm: ./run.sh full. Each entry installs its own Julia,
  # because the point of the matrix is two Julia versions, not two copies of a
  # command.
  test:
    timeout-minutes: 120
    name: test (julia ${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.10 is the current long-term support release; "1" tracks stable.
        julia-version: ["1.10", "1"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Julia ${{ matrix.julia-version }}
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia artifacts and packages
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0

      - name: Run ./run.sh full
        run: ./run.sh full

  # One job owns the arms that need no package environment. Lint runs once,
  # not once per matrix entry; the docs arm installs nothing and uses the
  # runner's python3.
  static:
    timeout-minutes: 30
    name: static (lint, docs)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Julia
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.10"

      - name: Run ./run.sh lint
        run: ./run.sh lint

      - name: Run ./run.sh docs
        run: ./run.sh docs

  # Runs the shared gnn.importers reader over specs/gnn-pin.json,
  # .github/GNN.md and specs/coin_flip.gnn.md, then validates the document
  # with the GNN revision pinned in specs/gnn-pin.json and checks that the
  # dependency-free Julia reader in src/spec_reader.jl reads the same
  # declarations. The job runs the same arm a local run does: ./run.sh gnn
  # provisions the pinned revision into its own runtime and digest-verifies
  # the parser files before parsing.
  gnn-conformance:
    timeout-minutes: 120
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12 and uv
        # uv's version is not repeated here: uv.toml pins it with
        # required-version, so a mismatch fails loudly instead of drifting.
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.12"
          cache-dependency-glob: "uv.toml"

      - name: Set up Julia
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.10"

      - name: Run ./run.sh gnn
        run: ./run.sh gnn
