name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 120
    name: test (julia ${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.10 is the current long-term support release; "1" tracks stable.
        julia-version: ["1.10", "1"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Julia ${{ matrix.julia-version }}
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia artifacts and packages
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0

      - name: Run the package test suite
        uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0

  gnn-conformance:
    timeout-minutes: 120
    # Validates specs/coin_flip.gnn.md with the GNN revision pinned in
    # specs/gnn-pin.json and checks that the dependency-free Julia reader in
    # src/spec_reader.jl reads the same declarations. The pinned revision is
    # installed into its own runtime, and the parser files are digest-verified
    # against the pin record before the document is parsed.
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # v10.3.3; setup-uv publishes no floating v10 major tag, so @v10 is unresolvable
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up Julia
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.10"

      - name: Provision the pinned GNN parser runtime
        run: |
          set -euo pipefail
          PIN=specs/gnn-pin.json
          PY=$(uv python find --no-project 3.12)
          REPO=$("$PY" -c "import json;print(json.load(open('$PIN'))['repository'])")
          COMMIT=$("$PY" -c "import json;print(json.load(open('$PIN'))['commit'])")
          uv venv --python 3.12 "$RUNNER_TEMP/gnn-runtime"
          # The install follows specs/gnn-pin.json; a pin bump re-points it.
          uv pip install --python "$RUNNER_TEMP/gnn-runtime/bin/python" \
            "generalized-notation-notation @ git+${REPO}@${COMMIT}"

      - name: Verify the pinned GNN tag and commit
        run: |
          set -euo pipefail
          PIN=specs/gnn-pin.json
          PY=$(uv python find --no-project 3.12)
          REPO=$("$PY" -c "import json;print(json.load(open('$PIN'))['repository'])")
          COMMIT=$("$PY" -c "import json;print(json.load(open('$PIN'))['commit'])")
          TAG=$("$PY" -c "import json;print(json.load(open('$PIN'))['tag'])")
          # Resolve the tag in the upstream object store; an annotated tag also
          # advertises its peeled commit. A tag that points elsewhere is a pin
          # failure, never a warning.
          RESOLVED=$(git ls-remote --tags "$REPO" "refs/tags/${TAG}^{}" | awk '{print $1}')
          if [ -z "$RESOLVED" ]; then
            RESOLVED=$(git ls-remote --tags "$REPO" "refs/tags/${TAG}" | awk '{print $1}')
          fi
          test -n "$RESOLVED"
          test "$RESOLVED" = "$COMMIT"
          echo "gnn-tag=${TAG} commit=${COMMIT}" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the GNN specification against the pinned parser
        run: >-
          "$RUNNER_TEMP/gnn-runtime/bin/python" scripts/validate_gnn_spec.py
          --gnn-runtime "$RUNNER_TEMP/gnn-runtime/bin/python"
          --verify-tag-remote
          --julia julia --json

      - name: Report the resolved GNN version
        run: |
          PIN=specs/gnn-pin.json
          VERSION=$("$RUNNER_TEMP/gnn-runtime/bin/python" -c 'import gnn; print(gnn.__version__)')
          TAG=$(python3 -c "import json;print(json.load(open('$PIN'))['tag'])")
          test -n "$VERSION"
          test "$VERSION" = "${TAG#v}"
          echo "gnn-version=${VERSION}" >> "$GITHUB_STEP_SUMMARY"
